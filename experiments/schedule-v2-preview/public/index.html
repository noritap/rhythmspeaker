<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#f7f6f2">
<title>レッスンを探す｜Rhythm Speaker</title>
<style>
:root{color-scheme:dark;--ink:#f3f3f3;--muted:#bdbdbd;--line:#343434;--panel:#0a0a0a}
*{box-sizing:border-box}body{margin:0;background:#050505;color:var(--ink);font:16px/1.55 system-ui,sans-serif}
button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid white;outline-offset:2px}[hidden]{display:none!important}
.head,.wrap{max-width:780px;margin:auto;padding:16px clamp(12px,4vw,26px)}
.head{display:flex;justify-content:space-between;align-items:center}.brand{font-size:14px;letter-spacing:.07em;text-transform:uppercase}.brand small{display:none}
.wrap{border:1px solid var(--line);border-radius:20px;background:var(--panel);margin-bottom:24px}h1{margin:0;font-size:clamp(26px,5vw,36px)}.lead,.meta,.small,.weekday,.count,.bottom{color:var(--muted)}.lead{margin:6px 0 14px}
.button,.month-nav button{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:6px 12px;border:1px solid var(--line);border-radius:10px;background:#242424;color:var(--ink);text-decoration:none}.button:disabled{opacity:.6}
#today{float:right;font-size:12px;margin-bottom:6px}#calendarPanel{clear:both}.month-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0 12px}.month-nav button{border-radius:999px;background:transparent}.month-nav strong{font-size:clamp(18px,4vw,24px)}
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.weekday{text-align:center;font-size:13px}
.day{position:relative;min-width:0;min-height:44px;padding:4px 0 9px;border:1px solid #444;border-radius:10px;background:#2d2d2d;color:var(--ink);text-align:center}.day.past{background:#222;color:#aaa}.day[aria-pressed=true]{background:#090909;border-color:#ddd;font-weight:700}.day .n{position:absolute;bottom:5px;left:50%;width:5px;height:5px;border-radius:50%;background:#bcbcbc;transform:translateX(-50%)}
.actions{display:flex;align-items:center;justify-content:space-between;gap:8px;border-top:1px solid var(--line);margin:16px 0 12px;padding-top:16px}h2{font-size:20px;margin:0}.count{white-space:nowrap}.cards{display:grid;gap:10px}
.class{display:grid;grid-template-columns:minmax(0,1fr) auto;width:100%;gap:10px;align-items:center;text-align:left;background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:13px 16px}.class strong,.class .meta{display:block;overflow-wrap:anywhere}.when{font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}.class strong{font-size:18px;margin:3px 0}.chevron{font-size:26px;color:var(--muted)}.tag{display:block;font-size:13px;color:#f7c28d}.empty,.status,.hint{padding:12px;border:1px solid var(--line);border-radius:10px}.status{margin-bottom:10px}.status.warning{color:#f7c28d}#nextDate{margin-top:12px}.bottom{border-top:1px solid var(--line);margin-top:20px;padding-top:12px;font-size:13px}
dialog{width:min(480px,calc(100% - 24px));color:var(--ink);background:#151515;border:1px solid var(--line);border-radius:14px;padding:16px}dialog::backdrop{background:#000a}dialog textarea{width:100%;min-height:104px}dialog .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
</style></head><body>
<header><div class="head"><div class="brand">Rhythm Speaker <small>TAP DANCE STUDIO / IKEBUKURO</small></div></div></header>
<main class="wrap"><h1>レッスンを探す</h1><p class="lead">希望の日付を選んでください。予約はスタジオからの返信後に確定します。</p>
<div id="status" class="status" role="status" aria-live="polite">予定を確認しています。</div>
<button id="today" class="button alt">今日に戻る</button>
<div id="calendarPanel"></div>
<div class="actions"><h2 id="listTitle"></h2><span class="count" id="count"></span></div><section id="cards" class="cards" aria-live="polite"></section>
<button id="nextDate" class="button alt" hidden>次の開催日を見る</button>
<div class="bottom"><a href="https://lin.ee/zC5YLe7" target="_blank" rel="noopener">希望日時を相談する</a><p><a href="https://noritap.github.io/rhythmspeaker/schedule/">公式予約ページ</a></p></div>
</main>
<dialog id="detail" aria-labelledby="detailTitle"><button id="close" class="button alt" style="float:right">閉じる</button><h2 id="detailTitle">レッスンの内容</h2><div id="detailMeta"></div><div id="composer" hidden><p class="hint">LINEでは文面をコピーして貼り付けてください。スタジオからの返信後に予約が確定します。</p><label for="draft">申し込み文面（編集できます）</label><textarea id="draft"></textarea><div class="row"><button id="copy" class="button">文章をコピーする</button></div><div id="copystatus" class="small" role="status"></div></div><div id="detailActions" class="row"></div></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=d=>new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',weekday:'short'}).format(new Date(d+'T12:00:00+09:00'));
const todayTokyo=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',dateStyle:'short'}).format(new Date());
const S={date:todayTokyo(),all:[],info:null};
S.month=S.date.slice(0,7);
let requestVersion=0;
let displayedToday=todayTokyo();
let lastLoad=0;
function status(){
 const state=S.info?.dataState,e=$('#status');
 e.hidden=state==='ready';
 e.classList.toggle('warning',state==='stale'||state==='unavailable');
 e.textContent=state==='loading'?'予定を確認しています…':
  state==='stale'?'予定の更新が遅れています。表示は参考情報です。最新の状況はスタジオにご確認ください。':
  state==='unavailable'?'開催予定を取得できませんでした。スタジオに最新の予定をご確認ください。':'';
}
async function load(){
 const version=++requestVersion;
 lastLoad=Date.now();
 if($('#detail').open)$('#detail').close();
 S.all=[];S.info={dataState:'loading'};render();
 try{
  const response=await fetch('/api/classes',{cache:'no-store',signal:AbortSignal.timeout(16000)});
  const data=await response.json();
  if(!response.ok||data.source!=='google_calendar'||!Array.isArray(data.sessions))throw Error('schedule unavailable');
  if(version!==requestVersion)return;
  S.info=data;S.all=data.sessions;
 }catch{if(version!==requestVersion)return;S.info={dataState:'unavailable'};}
 render();
}
function matching(){
 const now=Date.now();
 return S.all.filter(x=>Date.parse(x.date+'T'+x.end+':00+09:00')>now);
}
function renderCalendar(){
 const panel=$('#calendarPanel');const matches=matching();const today=todayTokyo();
 const [y,m]=S.month.split('-').map(Number),first=new Date(Date.UTC(y,m-1,1)),last=new Date(Date.UTC(y,m,0)).getUTCDate(),blank=first.getUTCDay();
 let out='<div class="month-nav"><button data-shift="-1" aria-label="前の月">前の月</button><strong>'+y+'年'+m+'月</strong><button data-shift="1" aria-label="次の月">次の月</button></div><div class="calendar">'+['日','月','火','水','木','金','土'].map(x=>'<div class="weekday">'+x+'</div>').join('');
 for(let i=0;i<blank;i++)out+='<div></div>';
 for(let d=1;d<=last;d++){const date=S.month+'-'+String(d).padStart(2,'0'),n=matches.filter(x=>x.date===date&&x.publicStatus!=='CANCELLED').length;out+='<button class="day'+(date<today?' past':'')+'" aria-label="'+fmtDate(date)+(n?' '+n+'件':'')+'" data-date="'+date+'" aria-pressed="'+(S.date===date)+'">'+d+(n?'<span class="n" aria-hidden="true"></span>':'')+'</button>';}
 panel.innerHTML=out+'</div>';
}
function render(){
 status();renderCalendar();
 const matches=matching();
 const rows=matches.filter(x=>x.date===S.date);
 const next=matches.find(x=>x.date>S.date&&x.publicStatus!=='CANCELLED');
 $('#nextDate').hidden=rows.length>0||!next;
 $('#nextDate').onclick=()=>selectDate(next.date);
 $('#listTitle').textContent=fmtDate(S.date)+' のレッスン'+(S.date===todayTokyo()?'（今日）':'');
 $('#count').textContent=S.info?.dataState==='ready'?rows.length+'件':'';
 if(S.info?.dataState==='loading'){$('#cards').replaceChildren();return;}
 if(S.info?.dataState==='unavailable'){$('#cards').replaceChildren();return;}
 $('#cards').innerHTML=rows.length?rows.map(x=>{
 const label=statusLabel(x);
 return '<button class="class" data-id="'+esc(x.id)+'"><span><span class="when">'+esc(x.start)+'–'+esc(x.end)+'</span><strong>'+esc(x.className)+'</strong><span class="meta">担当：'+esc(x.instructorName)+'</span>'+(label==='開催予定'?'':'<span class="tag">'+esc(label)+'</span>')+'</span><span class="chevron" aria-hidden="true">›</span></button>';
 }).join(''):'<div class="empty">'+(S.date===todayTokyo()?'本日の残りの開催予定はありません。':'この日の該当するレッスンはありません。')+'</div>';
}
function statusLabel(s){
 if(s.publicStatus!=='CANCELLED'&&Date.parse(s.date+'T'+s.start+':00+09:00')<=Date.now())return '開催中・受付終了';
 return {CANCELLED:'開催中止',CLOSE:'追加受付停止',INQUIRY_ONLY:'要問い合わせ'}[s.publicStatus] ||
  (S.info?.dataState==='stale'?'更新確認が必要':'開催予定');
}
async function confirmSession(session){
 const response=await fetch('/api/classes',{cache:'no-store',signal:AbortSignal.timeout(16000)});
 const data=await response.json();
 const current=data.sessions?.find(row=>row.id===session.id);
 if(!response.ok||data.source!=='google_calendar'||data.dataState!=='ready'||data.canRequest!==true||
    !current||session.publicStatus!=='OPEN'||current.publicStatus!=='OPEN'||
    !(Date.parse(current.date+'T'+current.start+':00+09:00')>Date.now())||['date','start','end','className','instructorName','publicStatus'].some(k=>current[k]!==session[k]))throw Error();
}
function openDetail(id){
 const s=S.all.find(x=>x.id===id);if(!s)return;
 $('#detailTitle').textContent=s.className;
 $('#detailMeta').textContent=fmtDate(s.date)+' '+s.start+'〜'+s.end+' ／ '+s.instructorName+' ／ '+statusLabel(s);
 $('#composer').hidden=true;$('#detailActions').replaceChildren();$('#copystatus').textContent='';
 $('#detail').showModal();
 if(s.publicStatus==='INQUIRY_ONLY'){
  $('#detailActions').innerHTML='<a class="button alt" href="https://lin.ee/zC5YLe7" target="_blank" rel="noopener">公式LINEで相談する</a>';
  return;
 }
 if(s.publicStatus!=='OPEN'||S.info?.canRequest!==true||Date.parse(s.date+'T'+s.start+':00+09:00')<=Date.now())return;
 const message=['レッスンに参加したいです。','希望クラス：'+s.className,
  '希望日時：'+s.date+' '+s.start+'〜'+s.end,'担当：'+s.instructorName].join('\n');
 $('#draft').value=message;
 const compose=document.createElement('button');
 compose.className='button';
 compose.textContent='申し込み文面を作る';
 $('#detailActions').append(compose);
 compose.onclick=async()=>{
  compose.disabled=true;
  try{
   await confirmSession(s);
   if(!$('#detail').open||!compose.isConnected)return;
   $('#composer').hidden=false;
   $('#detailActions').innerHTML='<button class="button" id="line">LINEを開く</button><button class="button alt" id="email">メールで申し込む</button>';
   const email=$('#email');
   const expire=()=>{
    if(!email.isConnected)return;
    $('#composer').hidden=true;
    $('#detailActions').textContent='予定をもう一度確認するには、詳細を開き直してください。';
   };
   for(const link of $('#detailActions').querySelectorAll('button')){
    link.onclick=async ()=>{
     link.disabled=true;
     try{
      await confirmSession(s);
      if($('#detail').open&&link.isConnected){
       location.href=link===email
        ? 'mailto:rhythmspeaker296@gmail.com?subject='+encodeURIComponent('レッスン参加希望')+'&body='+encodeURIComponent($('#draft').value)
        : 'https://lin.ee/zC5YLe7';
       link.disabled=false;
      }
     }catch{
      if(link.isConnected)expire();
     }
    };
   }
   setTimeout(expire,60000);
   $('#draft').focus();
  }catch{compose.replaceWith('最新の予定を確認できませんでした。ページを更新してご確認ください。');}
 };
 compose.click();
}
function selectDate(date){
 S.date=date;S.month=date.slice(0,7);render();
}
$('#calendarPanel').addEventListener('click',e=>{
 const button=e.target.closest('button');
 if(!button)return;
 if(button.dataset.date){selectDate(button.dataset.date);return;}
 const [year,month]=S.month.split('-').map(Number);
 const first=new Date(Date.UTC(year,month-1+Number(button.dataset.shift),1)).toISOString().slice(0,10);
 selectDate(first.slice(0,7)===todayTokyo().slice(0,7)?todayTokyo():first);
});
$('#today').onclick=()=>selectDate(todayTokyo());
function refreshOnReturn(){
 const today=todayTokyo();
 if(today!==displayedToday){
  if(S.date===displayedToday||S.date<today)selectDate(today);
  displayedToday=today;
  load();
 }else if(Date.now()-lastLoad>=60000)load();
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')refreshOnReturn();});
window.addEventListener('pageshow',event=>{if(event.persisted)refreshOnReturn();});
$('#cards').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(b)openDetail(b.dataset.id)});
$('#close').onclick=()=>$('#detail').close();
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#draft').value);$('#copystatus').textContent='コピーしました。LINEの入力欄に貼り付けてください。'}catch{$('#copystatus').textContent='コピーできませんでした。選択して手動コピーしてください。'}};
load();
</script></body></html>
