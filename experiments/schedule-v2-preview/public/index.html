<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="theme-color" content="#f7f6f2">
<title>レッスンを探す｜Rhythm Speaker 試験ページ</title>
<style>
:root{--ink:#20221f;--muted:#626860;--cream:#f7f6f2;--white:#fff;--line:#deddd4;--accent:#9a7152;--danger:#8e3a23;--good:#3f6350}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;line-height:1.6}button,select,input,textarea{font:inherit}button{cursor:pointer}a{color:inherit}header{background:#fff;border-bottom:1px solid var(--line)}.head{max-width:1100px;margin:auto;padding:15px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:800;letter-spacing:.025em}.brand small{display:block;color:var(--muted);font-size:10px;font-weight:500;letter-spacing:.15em}.trial{font-size:12px;color:#795139;border:1px solid #d5bdab;padding:7px 11px;border-radius:20px}.wrap{max-width:980px;margin:auto;padding:28px 18px 90px}.eyebrow{color:#85674b;font-size:10px;font-weight:800;letter-spacing:.22em;margin:0 0 9px}h1{font-size:clamp(24px,5vw,35px);line-height:1.35;margin:0 0 10px;letter-spacing:-.03em}.lead{color:var(--muted);font-size:14px;margin:0 0 24px}.lab{border-left:4px solid #b69875;background:#efebe3;padding:12px 15px;margin:16px 0 28px;font-size:12px}.lab strong{font-size:13px}.lab a{text-decoration:underline}.status{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;margin-bottom:18px;font-size:12px}.status.warning{border-color:#dbb39c;background:#fff7f0}.status strong{display:block;font-size:13px}.status p{margin:4px 0 0}.switches{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:19px 0}.switches button{padding:14px 6px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:13px;min-height:52px}.switches button[aria-pressed=true]{background:#22251f;color:#fff;border-color:#22251f}.filter{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:13px 0 20px}.filter label{display:block;font-size:11px;font-weight:700;color:#50554d}.filter select,.filter input{display:block;width:100%;margin-top:6px;border:1px solid #d1d0c8;background:white;padding:11px 12px;min-height:47px;border-radius:8px;font-size:14px;min-width:0}.filter .full{grid-column:1/-1}.actions{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:16px 0 10px}h2{font-size:20px;margin:0}.count{font-size:12px;color:var(--muted)}.cards{display:grid;gap:10px}.class{border:1px solid var(--line);border-radius:12px;background:#fff;padding:18px;display:grid;grid-template-columns:112px minmax(0,1fr) auto;align-items:center;gap:15px}.class h3{font-size:18px;margin:0 0 5px}.meta{font-size:12px;color:var(--muted);margin:0}.when strong{display:block;font-size:15px}.when{font-size:12px;color:var(--muted)}.tag{display:inline-block;font-size:11px;color:var(--good);font-weight:700;margin-bottom:6px}.tag.closed{color:var(--danger)}.button{display:inline-flex;justify-content:center;align-items:center;background:#22251f;color:white;border:1px solid #22251f;border-radius:8px;padding:10px 14px;text-decoration:none;min-height:44px;font-size:13px;font-weight:700}.button.alt{background:white;color:#22251f;border-color:#c6c4ba}.button:disabled{opacity:.5;cursor:default}.empty{background:white;border:1px solid var(--line);border-radius:12px;padding:22px;font-size:14px}.empty p{color:var(--muted)}.bottom{border-top:1px solid var(--line);padding-top:24px;color:var(--muted);font-size:12px;margin-top:26px}.month-nav{display:flex;align-items:center;gap:10px;justify-content:space-between;margin-bottom:12px}.month-nav strong{font-size:16px}.month-nav button{background:white;border:1px solid var(--line);border-radius:8px;min-height:40px;padding:8px 14px}.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-bottom:20px}.weekday{text-align:center;color:var(--muted);font-size:10px;padding:6px 0}.day{padding:8px 5px;min-height:64px;background:white;border:1px solid var(--line);border-radius:7px;text-align:left;font-size:12px;min-width:0}.day .n{display:block;color:#876a4c;font-size:10px;margin-top:2px}.day[aria-pressed=true]{border:2px solid #22251f;background:#f0ece5}.day:disabled{color:#a9aba6;background:#f1f1ed;cursor:default}dialog{border:0;border-radius:15px;width:min(560px,calc(100vw - 22px));max-height:calc(100dvh - 26px);overflow:auto;box-shadow:0 18px 65px #0005;padding:22px}dialog::backdrop{background:#222a25ba}dialog h2{margin-bottom:8px}dialog textarea{width:100%;min-height:170px;border-radius:9px;border:1px solid var(--line);padding:12px;font-size:16px;margin:7px 0 14px}dialog .row{display:flex;flex-wrap:wrap;gap:9px;margin-top:12px}.small{color:var(--muted);font-size:12px}.hint{background:#f7f1e8;padding:11px;border-radius:8px;font-size:12px}.screen{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden} :is(button,select,input,textarea,a):focus-visible{outline:3px solid #9d693c;outline-offset:3px}@media(max-width:700px){.class{grid-template-columns:90px 1fr}.class .button{grid-column:2;justify-self:stretch}.wrap{padding:22px 13px 75px}}@media(max-width:350px){.class{padding:13px;gap:9px;grid-template-columns:75px 1fr}.class h3{font-size:16px}.calendar{gap:2px}.day{min-height:58px;padding:4px;font-size:11px}.head{padding:12px}}
[hidden]{display:none!important}#more{margin-top:14px}.class h3,.meta{overflow-wrap:anywhere}</style></head><body>
<header><div class="head"><div class="brand">Rhythm Speaker <small>TAP DANCE STUDIO / IKEBUKURO</small></div><span class="trial">試験ページ</span></div></header>
<main class="wrap"><h1>レッスンを探す</h1><p class="lead">日程や先生から探せます。予約はスタジオからの返信後に確定します。</p>
<div id="status" class="status" role="status" aria-live="polite">予定を確認しています。</div>
<div class="switches" role="group" aria-label="日程の探し方"><button id="listBtn" aria-pressed="true">これからのレッスン</button><button id="monthBtn" aria-pressed="false">日付から探す</button></div>
<div id="filters" class="filter"></div><div id="calendarPanel"></div><div class="actions"><h2 id="listTitle">これからの開催予定</h2><span class="count" id="count"></span></div><section id="cards" class="cards" aria-live="polite"></section>
<button id="more" class="button alt" hidden>さらに表示</button>
<div class="bottom"><a href="https://lin.ee/zC5YLe7" target="_blank" rel="noopener">希望日時を相談する</a><p><a href="https://noritap.github.io/rhythmspeaker/schedule/">公式予約ページ</a></p></div>
</main>
<dialog id="detail" aria-labelledby="detailTitle"><button id="close" class="button alt" style="float:right">閉じる</button><h2 id="detailTitle">レッスンの内容</h2><div id="detailMeta"></div><div id="composer" hidden><p class="hint">LINEでは文面をコピーして貼り付けてください。スタジオからの返信後に予約が確定します。</p><label for="draft">申し込み文面（編集できます）</label><textarea id="draft"></textarea><div class="row"><button id="copy" class="button">文章をコピーする</button></div><div id="copystatus" class="small" role="status"></div></div><div id="detailActions" class="row"></div></dialog>
<script>
'use strict';
const S={limit:8,moreDays:false,view:'list',type:'',teacher:'',query:'',date:'',month:'',all:[],info:null,active:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmtDate=d=>new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',month:'numeric',day:'numeric',weekday:'short'}).format(new Date(d+'T12:00:00+09:00'));
const nowTokyo=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit'}).format(new Date());
function status(){
 const state=S.info?.dataState,e=$('#status');
 e.hidden=state==='ready';
 e.classList.toggle('warning',state==='stale'||state==='unavailable');
 e.textContent=state==='loading'?'予定を確認しています…':
  state==='stale'?'予定の更新が遅れています。表示は参考情報です。最新の状況はスタジオにご確認ください。':
  state==='unavailable'?'開催予定を取得できませんでした。スタジオに最新の予定をご確認ください。':'';
}
async function load(){
 S.month=nowTokyo();S.info={dataState:'loading'};status();
 try{
  const response=await fetch('/api/classes',{cache:'no-store',signal:AbortSignal.timeout(16000)});
  const data=await response.json();
  if(!response.ok||data.source!=='google_calendar'||!Array.isArray(data.sessions))throw Error('schedule unavailable');
  S.info=data;S.all=data.sessions;
 }catch{S.info={dataState:'unavailable'};S.all=[];}
 renderControls();render();
}
function matching(){const q=S.query.normalize('NFKC').toLowerCase();return S.all.filter(x=>(!S.type||x.classType===S.type)&&(!S.teacher||x.instructorName===S.teacher)&&(!q||[x.className,x.instructorName].some(y=>String(y).normalize('NFKC').toLowerCase().includes(q)))&&(!S.date||x.date===S.date));}
function renderControls(){
 $('#listBtn').setAttribute('aria-pressed',String(S.view==='list'));$('#monthBtn').setAttribute('aria-pressed',String(S.view==='month'));
 const types=[...new Set(S.all.map(x=>x.classType))].sort(),teachers=[...new Set(S.all.map(x=>x.instructorName))].sort();
 $('#filters').innerHTML='<label>レッスンの種類<select id="type"><option value="">すべてのレッスン</option>'+types.map(x=>'<option value="'+esc(x)+'" '+(S.type===x?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></label><label>先生を選ぶ<select id="teacher"><option value="">すべての先生</option>'+teachers.map(x=>'<option value="'+esc(x)+'" '+(S.teacher===x?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></label><label class="full">クラス名・先生の名前で探す<input id="query" placeholder="例：タップ、古庄" value="'+esc(S.query)+'"></label>';
}
function renderCalendar(){
 const panel=$('#calendarPanel');if(S.view!=='month'){panel.innerHTML='';return;}
 const [y,m]=S.month.split('-').map(Number),first=new Date(Date.UTC(y,m-1,1)),last=new Date(Date.UTC(y,m,0)).getUTCDate(),blank=first.getUTCDay();
 let out='<div class="month-nav"><button data-shift="-1" aria-label="前の月">前の月</button><strong>'+y+'年 '+m+'月</strong><button data-shift="1" aria-label="次の月">次の月</button></div><div class="calendar">'+['日','月','火','水','木','金','土'].map(x=>'<div class="weekday">'+x+'</div>').join('');
 for(let i=0;i<blank;i++)out+='<div></div>';
 for(let d=1;d<=last;d++){const date=S.month+'-'+String(d).padStart(2,'0'),n=matchingWithoutDate().filter(x=>x.date===date&&x.publicStatus!=='CANCELLED').length;out+='<button class="day" data-date="'+date+'" aria-pressed="'+(S.date===date)+'">'+d+(n?'<span class="n">'+n+'件</span>':'')+'</button>';}
 panel.innerHTML=out+'</div><button class="button alt" id="clearDate" '+(!S.date?'disabled':'')+'>選んだ日付を解除</button>';
}
function matchingWithoutDate(){const d=S.date;S.date='';const rows=matching();S.date=d;return rows;}
function render(){
 status();renderCalendar();
 $('#listBtn').setAttribute('aria-pressed',String(S.view==='list'));
 $('#monthBtn').setAttribute('aria-pressed',String(S.view==='month'));
 const matches=matching();
 const until=new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo',dateStyle:'short'}).format(new Date(Date.now()+7*86400000));
 const available=S.date||S.moreDays||S.query||S.type||S.teacher?matches:matches.filter(x=>x.date<until);
 const rows=S.date?available:available.slice(0,S.limit);
 $('#more').hidden=rows.length>=matches.length||Boolean(S.date);
 $('#listTitle').textContent=S.date?fmtDate(S.date)+' のレッスン':'これからの開催予定';
 $('#count').textContent=rows.length+'件表示';
 if(S.info?.dataState==='unavailable'){$('#cards').innerHTML='<div class="empty"><strong>開催予定を取得できませんでした。</strong><p>現在の本番ページと公式LINEで最新情報をご確認ください。</p><a href="https://lin.ee/zC5YLe7" target="_blank" rel="noopener" class="button alt">公式LINEで相談する</a></div>';return;}
 $('#cards').innerHTML=rows.length?rows.map(x=>{
 const cancelled=x.publicStatus==='CANCELLED',closed=x.publicStatus==='CLOSE',label=statusLabel(x);
 return '<article class="class"><div class="when"><strong>'+esc(fmtDate(x.date))+'</strong>'+esc(x.start)+'–'+esc(x.end)+'</div><div><span class="tag '+(cancelled||closed?'closed':'')+'">'+label+'</span><h3>'+esc(x.className)+'</h3><p class="meta">担当：'+esc(x.instructorName)+'</p></div><button class="button" data-id="'+esc(x.id)+'">詳しく見る</button></article>';
 }).join(''):'<div class="empty">該当するレッスンがありません。条件を変更してください。</div>';
}
function statusLabel(s){
 return {CANCELLED:'開催中止',CLOSE:'追加受付停止',INQUIRY_ONLY:'要問い合わせ'}[s.publicStatus] ||
  (S.info?.dataState==='stale'?'更新確認が必要':'開催予定');
}
function openDetail(id){
 const s=S.all.find(x=>x.id===id);if(!s)return;
 $('#detailTitle').textContent=s.className;
 $('#detailMeta').textContent=fmtDate(s.date)+' '+s.start+'〜'+s.end+' ／ '+s.instructorName+' ／ '+statusLabel(s);
 $('#composer').hidden=true;$('#detailActions').replaceChildren();$('#copystatus').textContent='';
 $('#detail').showModal();
 if(s.publicStatus!=='OPEN'||S.info?.canRequest!==true)return;
 const message=['レッスンに参加したいです。','希望クラス：'+s.className,
  '希望日時：'+s.date+' '+s.start+'〜'+s.end,'担当：'+s.instructorName].join('\n');
 $('#draft').value=message;
 const compose=document.createElement('button');
 compose.className='button';
 compose.textContent='申し込み文面を作る';
 $('#detailActions').append(compose);
 compose.onclick=async()=>{
  compose.disabled=true;
  try{
   const response=await fetch('/api/classes',{cache:'no-store',signal:AbortSignal.timeout(16000)});
   const data=await response.json();
   const current=data.sessions?.find(row=>row.id===s.id);
   const validFor=60000-(Date.now()-Date.parse(data.lastSuccessfulSyncAt));
   if(!response.ok||data.dataState!=='ready'||data.canRequest!==true||!(validFor>0)||!current||
      ['date','start','end','className','instructorName','publicStatus'].some(k=>current[k]!==s[k]))throw Error();
   if(!$('#detail').open||!compose.isConnected)return;
   $('#composer').hidden=false;
   $('#detailActions').innerHTML='<a class="button" href="https://lin.ee/zC5YLe7" target="_blank" rel="noopener">LINEを開く</a><a class="button alt" id="email">メールで申し込む</a>';
   const updateEmail=()=>{$('#email').href='mailto:rhythmspeaker296@gmail.com?subject='+encodeURIComponent('レッスン参加希望')+'&body='+encodeURIComponent($('#draft').value);};
   $('#draft').oninput=updateEmail;
   updateEmail();
   const email=$('#email');
   const expire=()=>{
    if(!email.isConnected)return;
    $('#composer').hidden=true;
    $('#detailActions').textContent='予定をもう一度確認するには、詳細を開き直してください。';
   };
   setTimeout(expire,validFor);
   $('#draft').focus();
  }catch{compose.replaceWith('最新の予定を確認できませんでした。ページを更新してご確認ください。');}
 };
}
$('#more').onclick=()=>{S.moreDays=true;S.limit+=8;render()};
$('#listBtn').onclick=()=>{S.view='list';S.date='';render()};
$('#monthBtn').onclick=()=>{S.view='month';render()};
$('#filters').addEventListener('change',e=>{if(e.target.id==='type')S.type=e.target.value;if(e.target.id==='teacher')S.teacher=e.target.value;S.date='';render()});
function search(e){
 if(e.target.id!=='query'||e.isComposing)return;
 S.query=e.target.value;S.limit=8;render();
}
$('#filters').addEventListener('input',search);
$('#filters').addEventListener('compositionend',search);
$('#calendarPanel').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.date)S.date=b.dataset.date;if(b.dataset.shift){let [y,m]=S.month.split('-').map(Number);S.month=new Date(Date.UTC(y,m-1+Number(b.dataset.shift),1)).toISOString().slice(0,7);S.date='';}if(b.id==='clearDate')S.date='';render()});
$('#cards').addEventListener('click',e=>{const b=e.target.closest('button[data-id]');if(b)openDetail(b.dataset.id)});
$('#close').onclick=()=>$('#detail').close();
$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#draft').value);$('#copystatus').textContent='コピーしました。LINEの入力欄に貼り付けてください。'}catch{$('#copystatus').textContent='コピーできませんでした。選択して手動コピーしてください。'}};
load();
</script></body></html>
