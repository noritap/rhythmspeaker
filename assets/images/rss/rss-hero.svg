  <title id="title">Rhythm Speaker Show digital tap archive hero</title>
  <desc id="desc">Warm digital tap-dance showcase scene with light trails, dancers, a smartphone recording setup, and archive tiles.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0e1118"/>
      <stop offset="0.42" stop-color="#1e2027"/>
      <stop offset="1" stop-color="#b8753f"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1b1716"/>
      <stop offset="0.5" stop-color="#5a3924"/>
      <stop offset="1" stop-color="#d49358"/>
    </linearGradient>
    <radialGradient id="warmGlow" cx="78%" cy="30%" r="55%">
      <stop offset="0" stop-color="#ffd09a" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#d5874e" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#11131b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.33" stop-color="#fff3c1" stop-opacity="0.78"/>
      <stop offset="0.68" stop-color="#f0aa52" stop-opacity="0.86"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>

