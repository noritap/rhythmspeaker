<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">Rhythm Speaker Show program default thumbnail</title>
  <desc id="desc">Fallback thumbnail for RSS program works</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08090d"/>
      <stop offset="0.52" stop-color="#182139"/>
      <stop offset="1" stop-color="#f7b84b"/>
    </linearGradient>
    <radialGradient id="glow" cx="70%" cy="42%" r="60%">
      <stop offset="0" stop-color="#ef3340" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ef3340" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <rect width="1280" height="720" fill="url(#glow)"/>
  <g opacity="0.45">
    <circle cx="110" cy="112" r="18" fill="#ef3340"/>
    <circle cx="220" cy="182" r="12" fill="#00a3ff"/>
    <circle cx="1060" cy="110" r="20" fill="#f7b84b"/>
    <circle cx="1145" cy="278" r="12" fill="#ef3340"/>
    <circle cx="930" cy="610" r="16" fill="#00b894"/>
    <circle cx="176" cy="585" r="14" fill="#f7b84b"/>
  </g>
  <g fill="none" stroke-linecap="round" opacity="0.7">
    <path d="M120 520 C360 380 520 600 760 440 S1050 350 1170 220" stroke="#fff" stroke-width="8" opacity="0.45"/>
    <path d="M80 560 C380 420 600 610 870 430 S1070 310 1210 200" stroke="#f7b84b" stroke-width="10" opacity="0.75"/>
    <path d="M120 600 C410 470 680 610 1040 380" stroke="#00a3ff" stroke-width="6" opacity="0.55"/>
  </g>
  <g filter="url(#shadow)">
    <rect x="82" y="78" width="260" height="74" rx="18" fill="#ef3340"/>
    <text x="212" y="126" text-anchor="middle" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="36" font-weight="900" fill="#fff">PROGRAM</text>
    <text x="82" y="298" font-family="Arial Black, Impact, 'Noto Sans JP', sans-serif" font-size="96" font-weight="900" fill="#fff">RHYTHM</text>
    <text x="82" y="402" font-family="Arial Black, Impact, 'Noto Sans JP', sans-serif" font-size="96" font-weight="900" fill="#fff">SPEAKER</text>
    <text x="82" y="506" font-family="Arial Black, Impact, 'Noto Sans JP', sans-serif" font-size="96" font-weight="900" fill="#fff">SHOW</text>
    <text x="810" y="470" font-family="Arial Black, Impact, sans-serif" font-size="190" font-weight="900" fill="#fff" opacity="0.96">#014</text>
    <text x="86" y="620" font-family="Arial, 'Noto Sans JP', sans-serif" font-size="40" font-weight="900" fill="#fff">今日のリズムを、未来に残す。</text>
  </g>
</svg>