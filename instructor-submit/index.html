<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>講師情報の提出｜Rhythm Speaker</title>
<style>body{margin:0;background:#111;color:#f5f5f5;font-family:system-ui,-apple-system,sans-serif;line-height:1.7}main{max-width:620px;margin:auto;padding:40px 20px}h1{font-size:clamp(1.6rem,5vw,2.4rem)}.panel{background:#222;border:1px solid #444;border-radius:16px;padding:24px}.cta{display:block;background:#f5f5f5;color:#111;text-align:center;text-decoration:none;font-weight:700;border-radius:10px;padding:15px;margin-top:18px}.cta:focus-visible{outline:3px solid #ffd36a;outline-offset:3px}a{color:#a9d6ff}.note{color:#c7c7c7;font-size:.93rem}</style></head>
<body><main><a href="../">← Rhythm Speaker</a><p>INSTRUCTOR PROFILE</p><h1>講師プロフィールの提出</h1><div class="panel"><p>講師情報はGoogleフォームで受け付けます。スマートフォンから回答できます。</p><p>送信後、管理者が確認します。<strong>送信だけで公式HPに公開されることはありません。</strong></p><p class="note">写真はフォームでは収集しません。管理者から別途ご案内します。連絡先メールアドレスは公開しません。</p><div id="status" role="status" aria-live="polite">フォームの受付準備中です。公開までお待ちください。</div><a id="form-link" class="cta" href="#" hidden rel="noopener noreferrer">Googleフォームで講師情報を提出する ↗</a></div><p class="note">以前の入力下書きをお持ちの方は、<a href="../instructor-registration/">旧入力ページ</a>から確認できます。旧ページの下書きはGoogleフォームに自動送信されません。</p></main>
<script src="./form-config.js"></script><script>
(function(){const url=window.RS_INSTRUCTOR_FORM_URL;const status=document.getElementById('status');const link=document.getElementById('form-link');if(typeof url!=='string'||!url.trim())return;try{const parsed=new URL(url);if(parsed.protocol!=='https:'||!['docs.google.com','forms.gle'].includes(parsed.hostname))throw Error('invalid form host');link.href=parsed.href;link.hidden=false;status.textContent='フォームの受付はこちらです。';}catch(e){status.textContent='フォームの受付準備中です。公開までお待ちください。';}})();
</script></body></html>
