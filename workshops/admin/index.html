<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Workshop Manager | Rhythm Speaker</title>
  <link rel="stylesheet" href="../assets/workshop-os-v2.css?v=20260829-3">
</head>
<body>
<div id="modebar" class="demo-notice">DEMO MODE</div>
<header class="site-header"><div class="shell site-header__inner"><a class="brand" href="../"><span class="brand__mark">RS</span><span class="brand__text"><strong>WORKSHOP MANAGER</strong><small>スマホ運営管理</small></span></a><a class="btn btn--ghost btn--small" href="../">公開ページ</a></div></header>
<main class="shell admin-shell">
  <section id="loginView" class="login-card">
    <p class="kicker">ADMIN LOGIN</p><h1>運営管理</h1>
    <p class="help">ワークショップの画像・文章・クラス・予約をここから管理します。</p>
    <form id="loginForm">
      <label>メール<input id="loginEmail" type="email" required value="rhythmspeaker296@gmail.com" autocomplete="email"></label>
      <label>パスワード<input id="loginPassword" type="password" required autocomplete="current-password" placeholder="8文字以上"></label>
      <button class="btn btn--full" type="submit">ログイン</button>
    </form>
  </section>

  <section id="adminView" class="admin-layout hidden">
    <aside class="admin-nav">
      <button id="newEventBtn" class="btn btn--gold">＋ 新しいイベント</button>
      <button id="dashboardBtn" class="btn btn--ghost">ダッシュボード</button>
      <button id="reservationsBtn" class="btn btn--ghost">全予約</button>
      <button id="logoutBtn" class="btn btn--ghost">ログアウト</button>
    </aside>
    <div class="admin-main">
      <div id="dashboardPane"><div class="row"><div><p class="kicker">DASHBOARD</p><h1>ワークショップ管理</h1></div></div><div id="stats" class="stats"></div><h2>イベント</h2><div id="adminEvents" class="cards"></div></div>
      <div id="editorPane" class="hidden"></div>
      <div id="reservationsPane" class="hidden"></div>
    </div>
  </section>
</main>
<div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../config.js"></script>
<script src="../assets/store.js?v=20260829-3"></script>
<script src="../assets/store-v2-adapter.js?v=20260829-3"></script>
<script src="./manager.js?v=20260829-3"></script>
<script src="./cms-v2.js?v=20260829-3"></script>
</body>
</html>
