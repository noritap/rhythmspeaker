<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Rhythm Speaker Workshops</title><meta name="description" content="Rhythm Speaker ワークショップ予約"><link rel="stylesheet" href="./assets/workshops.css?v=20260829-1">
  <link rel="stylesheet" href="./assets/naoyuki-poster-fix.css?v=20260829-1"></head><body>
<div id="modebar" class="modebar demo">DEMO MODE｜この端末内だけに保存されます</div>
<header class="topbar"><div class="shell"><a class="brand" href="./"><span class="brandmark">RS</span><span><strong>WORKSHOPS</strong><small>Rhythm Speaker</small></span></a><a class="btn subtle" href="./admin/">運営管理</a></div></header>
<main><section class="hero"><div class="shell"><p class="eyebrow">RHYTHM SPEAKER</p><h1>Workshop<br>Reservation</h1><p>Rhythm Speakerで開催するワークショップを、スマートフォンから確認・予約できます。</p></div></section><section class="section"><div class="shell"><h2 class="section-title">開催予定</h2><div id="eventList" class="cards"><div class="empty">読み込み中...</div></div></div></section></main><footer class="footer">Rhythm Speaker Workshop Manager</footer><div id="toast" class="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script src="./assets/store.js?v=20260829-1"></script><script>
const NAOYUKI_SLUG='naoyuki-2026-10-16',TILE_VERSION='20260829-1';
const fmtDate=s=>new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date(s+'T00:00:00'));
function posterTilesMarkup(){const tiles=[];for(let r=0;r<3;r++)for(let c=0;c<3;c++)tiles.push(`<img src="./assets/naoyuki-flyer-v3-r${r}c${c}.svg?v=${TILE_VERSION}" alt="" aria-hidden="true" loading="lazy">`);return `<div class="poster-tile-grid poster-tile-grid--cover" role="img" aria-label="NAOYUKI TAP DANCE WORKSHOP フライヤー">${tiles.join('')}</div>`}
function coverMarkup(e){if(e.slug===NAOYUKI_SLUG)return `<div class="event-cover event-cover--poster">${posterTilesMarkup()}</div>`;return `<div class="event-cover">${e.cover?`<img src="${e.cover}" alt="">`:'RHYTHM SPEAKER'}</div>`}
(async()=>{const store=await RSStore.get();if(store.mode==='live'){document.querySelector('#modebar').classList.remove('demo');document.querySelector('#modebar').textContent='LIVE｜オンライン予約システム';}const events=await store.listEvents({publishedOnly:true});const el=document.querySelector('#eventList');if(!events.length){el.innerHTML='<div class="empty">現在受付中のワークショップはありません。</div>';return;}el.innerHTML=events.map(e=>`<article class="event-card">${coverMarkup(e)}<div class="event-body"><span class="badge live">予約受付中</span><h2>${e.title}</h2><div class="meta"><strong>${fmtDate(e.date)}</strong><br>${e.venue||''}<br>${e.instructor?'Instructor: '+e.instructor:''}</div><p class="meta">${e.summary||''}</p><a class="btn full" href="./event.html?slug=${encodeURIComponent(e.slug)}">詳細・予約へ</a></div></article>`).join('');})();
</script></body></html>
