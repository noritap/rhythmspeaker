<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Rhythm Speaker Workshops</title><meta name="description" content="Rhythm Speaker ワークショップ予約">
  <link rel="stylesheet" href="./assets/workshop-os-v2.css?v=20260829-3">
</head>
<body>
<div id="modebar" class="demo-notice">DEMO MODE</div>
<header class="site-header"><div class="shell site-header__inner"><a class="brand" href="./"><span class="brand__mark">RS</span><span class="brand__text"><strong>WORKSHOPS</strong><small>Rhythm Speaker</small></span></a><div class="header-actions"><a class="btn btn--ghost btn--small" href="../">教室TOPへ</a></div></div></header>
<main>
  <section class="page-hero"><div class="shell"><p class="kicker">RHYTHM SPEAKER</p><h1 class="page-title">WORKSHOPS</h1><p class="page-lead">開催予定のワークショップと、これまでの開催記録をご覧いただけます。</p></div></section>
  <section class="section section--tight"><div class="shell"><div class="section-head"><div><p class="kicker">UPCOMING</p><h2>開催予定</h2><p>開催予定のワークショップです。受付状況は各詳細ページをご確認ください。</p></div></div><div id="eventList" class="list-grid"><p class="help">読み込み中...</p></div></div></section>
</main>
<footer class="site-footer"><div class="shell workshop-footer"><span>Rhythm Speaker Workshops</span><nav aria-label="Rhythm Speaker"><a href="../">教室TOP</a><a href="../trial/">初回体験</a><a href="../classes/">クラス</a><a href="../access/">アクセス</a></nav></div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script src="./assets/store.js?v=20260829-3"></script><script src="./assets/store-v2-adapter.js?v=20260829-3"></script>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const fmtDate=s=>new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date(s+'T00:00:00'));const yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(Number(n||0));
const todayJst=()=>new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
const card=(e,past)=>{const flyer=e.flyerUrl||e.cover||'';const prices=e.sessions.slice(0,3).map(s=>`<span class="price-chip">${esc(s.name)} ${yen(s.price)}</span>`).join('');const label=past?'開催終了':e.sessions.length?'詳細・予約へ':'詳細を見る';return `<article class="workshop-list-card"><div class="workshop-list-card__media">${flyer?`<div class="flyer-frame"><img loading="lazy" src="${esc(flyer)}" alt="${esc(e.title)} フライヤー"></div>`:`<div class="flyer-frame" style="min-height:220px;display:grid;place-items:center"><span class="help">写真準備中</span></div>`}</div><div class="workshop-list-card__body"><span class="status-pill">${past?'開催終了':e.sessions.length?'開催予定':'開催案内'}</span><h2>${esc(e.title)}</h2><div class="event-date">${fmtDate(e.date)}</div><div class="event-meta"><span>${esc(e.venue)}</span>${e.instructor?`<span>Instructor: ${esc(e.instructor)}</span>`:''}</div>${e.summary?`<p class="event-summary">${esc(e.summary)}</p>`:''}<div class="price-row">${prices}</div><a class="btn" href="./event.html?slug=${encodeURIComponent(e.slug)}">${past?'開催記録を見る':label}</a></div></article>`};
(async()=>{try{const store=await RSStore.get();if(store.mode!=='live')modebar.classList.add('is-visible');const events=await store.listEvents({publishedOnly:true});const today=todayJst();const upcoming=events.filter(e=>e.date>=today);const past=events.filter(e=>e.date<today).sort((a,b)=>b.date.localeCompare(a.date));eventList.innerHTML=upcoming.length?upcoming.map(e=>card(e,false)).join(''):'<p class="help">現在、開催予定のワークショップはありません。</p>';let shown=6;const renderPast=()=>{pastEventList.innerHTML=past.length?past.slice(0,shown).map(e=>card(e,true)).join(''):'<p class="help">公開済みの開催記録はありません。</p>';morePast.hidden=shown>=past.length};morePast.onclick=()=>{shown+=6;renderPast()};renderPast();}catch(err){const msg=esc(err.message||'読み込みに失敗しました');eventList.innerHTML=`<p class="help">${msg}</p>`;pastEventList.innerHTML=`<p class="help">${msg}</p>`}})();
</script>
</body></html>
