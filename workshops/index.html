<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Rhythm Speaker Workshops</title><meta name="description" content="Rhythm Speaker ワークショップ予約">
  <link rel="stylesheet" href="./assets/workshop-os-v2.css?v=20260829-3">
</head>
<body>
<div id="modebar" class="demo-notice">DEMO MODE</div>
<header class="site-header"><div class="shell site-header__inner"><a class="brand" href="./"><span class="brand__mark">RS</span><span class="brand__text"><strong>WORKSHOPS</strong><small>Rhythm Speaker</small></span></a><div class="header-actions"><a class="btn btn--ghost btn--small" href="./admin/">運営管理</a></div></div></header>
<main>
  <section class="page-hero"><div class="shell"><p class="kicker">RHYTHM SPEAKER</p><h1 class="page-title">WORKSHOPS</h1><p class="page-lead">開催予定のワークショップを確認し、そのままクラス選択・予約まで進めます。</p></div></section>
  <section class="section section--tight"><div class="shell"><div class="section-head"><div><p class="kicker">UPCOMING</p><h2>開催予定</h2><p>受付中のワークショップです。</p></div></div><div id="eventList" class="list-grid"><p class="help">読み込み中...</p></div></div></section>
</main>
<footer class="site-footer"><div class="shell">Rhythm Speaker Workshop Manager</div></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="./config.js"></script><script src="./assets/store.js?v=20260829-3"></script><script src="./assets/store-v2-adapter.js?v=20260829-3"></script>
<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const fmtDate=s=>new Intl.DateTimeFormat('ja-JP',{year:'numeric',month:'long',day:'numeric',weekday:'short'}).format(new Date(s+'T00:00:00'));const yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(Number(n||0));
(async()=>{try{const store=await RSStore.get();if(store.mode!=='live')modebar.classList.add('is-visible');const events=await store.listEvents({publishedOnly:true});if(!events.length){eventList.innerHTML='<p class="help">現在受付中のワークショップはありません。</p>';return}eventList.innerHTML=events.map(e=>{const flyer=e.flyerUrl||e.cover||'';const prices=e.sessions.slice(0,3).map(s=>`<span class="price-chip">${esc(s.name)} ${yen(s.price)}</span>`).join('');return `<article class="workshop-list-card"><div class="workshop-list-card__media">${flyer?`<div class="flyer-frame"><img src="${esc(flyer)}" alt="${esc(e.title)} フライヤー"></div>`:`<div class="flyer-frame" style="min-height:300px;display:grid;place-items:center"><span class="help">フライヤー準備中</span></div>`}</div><div class="workshop-list-card__body"><span class="status-pill">予約受付中</span><h2>${esc(e.title)}</h2><div class="event-date">${fmtDate(e.date)}</div><div class="event-meta"><span>${esc(e.venue)}</span>${e.instructor?`<span>Instructor: ${esc(e.instructor)}</span>`:''}</div>${e.summary?`<p class="event-summary">${esc(e.summary)}</p>`:''}<div class="price-row">${prices}</div><a class="btn" href="./event.html?slug=${encodeURIComponent(e.slug)}">詳細・予約へ</a></div></article>`}).join('');}catch(err){eventList.innerHTML=`<p class="help">${esc(err.message||'読み込みに失敗しました')}</p>`}})();
</script>
</body></html>
