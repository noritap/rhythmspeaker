<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ワークショップ一覧｜Rhythm Speaker</title>
  <meta name="description" content="Rhythm Speakerのワークショップを開催日や講師から探せます。">
  <link rel="stylesheet" href="./assets/workshop-os-v2.css?v=20260829-3">
  <link rel="stylesheet" href="./assets/sites-discovery.css?v=20261030-1">
</head>
<body class="rs-workshop-discovery">
  <a class="rs-ecosystem-return" href="../ecosystem/" aria-label="Rhythm Speaker 総合メニューへ">⌂ 総合メニュー</a>
  <div id="modebar" class="demo-notice">DEMO MODE</div>
  <header class="site-header">
    <div class="shell site-header__inner">
      <a class="brand" href="./" aria-label="Rhythm Speaker Workshops トップ">
        <span class="brand__mark">RS</span>
        <span class="brand__text"><strong>WORKSHOPS</strong><small>Rhythm Speaker</small></span>
      </a>
      <div class="header-actions"><a class="btn btn--ghost btn--small" href="../">教室TOPへ</a></div>
    </div>
  </header>
  <main>
    <section class="page-hero">
      <div class="shell">
        <p class="kicker">RHYTHM SPEAKER</p>
        <h1 class="page-title">ワークショップを探す</h1>
        <p class="page-lead">参加できる日から、気になる講師から。<br>あなたに合うワークショップを見つけましょう。</p>
      </div>
    </section>
    <section class="section section--tight" aria-labelledby="discoveryHeading">
      <div class="shell">
        <div class="section-head">
          <div><h2 id="discoveryHeading">開催スケジュール</h2><p>日付を選ぶと、その日に開催するワークショップが表示されます。</p></div>
        </div>
        <div class="rs-discovery-controls rs-mode-controls" aria-label="開催種別と表示方法">
          <div class="rs-control-group"><button type="button" data-rs-mode="upcoming" aria-pressed="true">開催予定</button><button type="button" data-rs-mode="past" aria-pressed="false">開催記録</button></div>
          <div class="rs-control-group"><button type="button" data-rs-view="calendar" aria-pressed="true">カレンダー</button><button type="button" data-rs-view="list" aria-pressed="false">一覧</button></div>
        </div>
        <div class="rs-discovery-controls rs-instructor-controls">
          <label for="rsInstructor">講師名で探す</label>
          <input id="rsInstructor" type="search" placeholder="講師名を入力" autocomplete="off">
          <button id="rsReset" type="button">条件を解除</button>
        </div>
        <div class="rs-discovery-layout">
          <section id="rsCalendarPanel" class="rs-calendar-panel" aria-label="開催日カレンダー">
            <div class="rs-discovery-month"><button id="rsPrev" type="button" aria-label="前月">←</button><strong id="rsMonth" aria-live="polite"></strong><button id="rsNext" type="button" aria-label="翌月">→</button></div>
            <div id="rsCalendar" class="rs-calendar" role="group" aria-label="ワークショップ開催日"></div>
            <p id="rsCalendarStatus" class="rs-calendar-status" role="status"></p>
          </section>
          <section id="rsListPanel" class="rs-list-panel" aria-labelledby="resultsHeading">
            <div class="rs-results-heading"><div><h2 id="resultsHeading">開催予定</h2><p id="rsResultsSummary" class="rs-results-summary" role="status">読み込み中...</p></div></div>
            <div id="eventList" class="list-grid"><p class="help">開催情報を読み込み中...</p></div>
          </section>
        </div>
      </div>
    </section>
  </main>
  <footer class="site-footer"><div class="shell workshop-footer"><span>Rhythm Speaker Workshops</span><nav aria-label="Rhythm Speaker"><a href="../">教室TOP</a><a href="../trial/">初回体験</a><a href="../classes/">クラス</a><a href="../access/">アクセス</a></nav></div></footer>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
  <script src="./assets/store.js?v=20260829-3"></script>
  <script src="./assets/store-v2-adapter.js?v=20260829-3"></script>
  <script src="./assets/sites-discovery.js?v=20261029-1"></script>
</body>
</html>
