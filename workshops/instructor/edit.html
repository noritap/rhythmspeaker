<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>WS内容の編集案 | Rhythm Speaker</title><link rel="stylesheet" href="../assets/workshop-os-v2.css"><style>main{max-width:760px;margin:40px auto;padding:20px}label{display:block;font-weight:700;margin:18px 0 8px}textarea,input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #aaa;border-radius:8px;font:inherit}textarea{min-height:120px}.note{padding:16px;background:#fff4d8;border-radius:12px;line-height:1.7}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}button{padding:14px;border-radius:8px;cursor:pointer}</style></head><body><main><a id="back" href="./">← 講師ページに戻る</a><h1>ワークショップ内容を編集</h1><p class="note">現在は編集案の作成機能です。入力内容は公開ページや予約データに自動保存されません。安全な講師別保存権限の実装後に公開反映を有効化します。</p><form id="draft"><label for="profile">講師プロフィール</label><textarea id="profile" maxlength="2000" placeholder="プロフィールを入力"></textarea><label for="description">ワークショップ紹介文</label><textarea id="description" maxlength="3000" placeholder="紹介文を入力"></textarea><label for="audience">対象者・レベル</label><input id="audience" maxlength="300" placeholder="初心者〜経験者"><label for="highlights">内容・ポイント</label><textarea id="highlights" maxlength="1500" placeholder="内容や特徴を入力"></textarea><div class="actions"><button type="submit">編集案をコピー</button><a id="public" href="../">一般公開ページを見る ↗</a></div></form><p id="message" role="status"></p></main><script>
const token=new URLSearchParams(location.search).get('token');
if(token&&/^[0-9a-f-]{36}$/i.test(token))document.getElementById('back').href='./?token='+encodeURIComponent(token);
else{document.getElementById('draft').hidden=true;document.getElementById('message').textContent='有効な講師専用URLからアクセスしてください。'}
document.getElementById('draft').addEventListener('submit',async e=>{e.preventDefault();const fields=[['講師プロフィール','profile'],['紹介文','description'],['対象レベル','audience'],['内容・ポイント','highlights']];const text='【WS編集案（未公開）】\n'+fields.map(([name,id])=>name+'：\n'+document.getElementById(id).value).join('\n\n');try{await navigator.clipboard.writeText(text);document.getElementById('message').textContent='編集案をコピーしました。スタジオ管理者へ送ってください。'}catch{document.getElementById('message').textContent='コピーできませんでした。入力内容を選択してコピーしてください。'}});
</script></body></html>
