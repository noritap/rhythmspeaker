<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><title>WS内容の編集案 | Rhythm Speaker</title><link rel="stylesheet" href="../assets/workshop-os-v2.css"><style>main{max-width:760px;margin:40px auto;padding:20px}label{display:block;font-weight:700;margin:18px 0 8px}textarea,input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #aaa;border-radius:8px;font:inherit}textarea{min-height:120px}.note{padding:16px;background:#fff4d8;border-radius:12px;line-height:1.7}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:20px}button{padding:14px;border-radius:8px;cursor:pointer}</style></head><body><main><a id="back" href="./">← 講師ページに戻る</a><h1>ワークショップ内容を編集</h1><p class="note">講師専用リンクで本人の担当イベントだけを編集できます。日時・料金・定員・予約・決済は変更できません。保存機能はサーバー側の権限設定が完了すると利用可能になります。</p><form id="draft"><label for="profile">講師プロフィール</label><textarea id="profile" maxlength="2000" placeholder="プロフィールを入力"></textarea><label for="description">ワークショップ紹介文</label><textarea id="description" maxlength="3000" placeholder="紹介文を入力"></textarea><label for="audience">対象者・レベル</label><input id="audience" maxlength="300" placeholder="初心者〜経験者"><label for="highlights">内容・ポイント</label><textarea id="highlights" maxlength="1500" placeholder="内容や特徴を入力"></textarea><div class="actions"><button type="submit">変更を保存</button><a id="public" href="../">一般公開ページを見る ↗</a></div></form><p id="message" role="status"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config.js"></script><script>
const token=new URLSearchParams(location.search).get('token');
const validToken=Boolean(token&&/^[0-9a-f-]{36}$/i.test(token));const cfg=window.RS_WORKSHOP_CONFIG||{};const client=validToken&&window.supabase&&cfg.supabaseUrl&&cfg.supabasePublishableKey?window.supabase.createClient(cfg.supabaseUrl,cfg.supabasePublishableKey):null;
if(validToken)document.getElementById('back').href='./?token='+encodeURIComponent(token);
else{document.getElementById('draft').hidden=true;document.getElementById('message').textContent='有効な講師専用URLからアクセスしてください。'}
const form=document.getElementById('draft'),message=document.getElementById('message'),save=form.querySelector('button[type="submit"]');
save.disabled=true;
async function load(){if(!client)return;try{const {data,error}=await client.rpc('get_workshop_instructor_edit_by_token',{p_token:token});if(error)throw error;for(const [id,key] of [['profile','instructor_profile'],['description','description'],['audience','target_audience'],['highlights','highlights']])document.getElementById(id).value=data[key]||'';if(/^[a-z0-9][a-z0-9-]*$/.test(data.slug||''))document.getElementById('public').href='../event.html?slug='+encodeURIComponent(data.slug);save.disabled=false;message.textContent='編集内容を読み込みました。';}catch(err){message.textContent='保存機能の準備中です。管理者による権限設定の完了をお待ちください。';}}
form.addEventListener('submit',async e=>{e.preventDefault();if(!client||save.disabled)return;save.disabled=true;message.textContent='保存中…';try{const {error}=await client.rpc('update_workshop_instructor_content_by_token',{p_token:token,p_profile:document.getElementById('profile').value,p_description:document.getElementById('description').value,p_audience:document.getElementById('audience').value,p_highlights:document.getElementById('highlights').value});if(error)throw error;message.textContent='保存しました。一般公開ページで確認できます。';}catch(err){message.textContent='保存できませんでした。変更内容はこの画面に残っています。再度お試しください。';}finally{save.disabled=false;}});
load();
</script></body></html>
