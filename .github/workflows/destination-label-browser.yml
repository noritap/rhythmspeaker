name: Destination Link Label UX QA
on:
  pull_request:
    paths:
      - 'index.html'
      - 'trial/index.html'
      - 'classes/index.html'
      - 'assets/ux-lab/app.js'
      - 'tools/destination_label_browser_check.cjs'
      - '.github/workflows/destination-label-browser.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'trial/index.html'
      - 'classes/index.html'
      - 'assets/ux-lab/app.js'
      - 'tools/destination_label_browser_check.cjs'
      - '.github/workflows/destination-label-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  destination-labels:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify six viewports, exact destinations, and keyboard activation
        run: |
          python3 -m http.server 8123 --directory .. >/tmp/rs-label-qa.log 2>&1 &
          node tools/destination_label_browser_check.cjs
      - name: Upload screenshot and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: destination-label-six-width-evidence
          path: ux-evidence/destination-labels/
