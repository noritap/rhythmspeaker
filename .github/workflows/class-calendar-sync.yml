name: Secure class-calendar publication

on:
  pull_request:
    paths:
      - "tools/sync_public_classes.py"
      - "tools/test_sync_public_classes.py"
      - ".github/workflows/class-calendar-sync.yml"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/test_sync_public_classes.py
      - run: python tools/test_public_class_projection.py

  publish:
    # Never run calendar access on PRs, forks, or without explicit approval.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      vars.RS_CALENDAR_SYNC_ENABLED == 'true' &&
      vars.RS_OPEN_CLASSES_APPROVED == 'true'
    needs: test
    runs-on: ubuntu-latest
    concurrency:
      group: publish-public-classes
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      RS_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.RS_GOOGLE_SERVICE_ACCOUNT_JSON }}
      RS_LESSON_CALENDAR_ID: ${{ secrets.RS_LESSON_CALENDAR_ID }}
      RS_SESSION_ID_KEY: ${{ secrets.RS_SESSION_ID_KEY }}
      RS_OPEN_CLASSES_APPROVED: ${{ vars.RS_OPEN_CLASSES_APPROVED }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "google-auth==2.38.0" "requests==2.32.3"
      - name: Generate approved public sessions only
        run: python tools/sync_public_classes.py
      - name: Validate public output and existing website contracts
        run: |
          python tools/test_sync_public_classes.py
          python tools/test_public_class_projection.py
          python tools/sites_migration_audit.py
      - name: Commit only the sanitized public projection
        run: |
          if git diff --quiet -- data/class-sessions.public.json; then
            echo "No public-data changes."
            exit 0
          fi
          git config user.name "rhythm-speaker-calendar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- data/class-sessions.public.json
          git commit -m "data(schedule): refresh approved public class sessions"
          git push origin HEAD:main
