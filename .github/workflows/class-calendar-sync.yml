name: Secure class-calendar publication

on:
  pull_request:
    paths:
      - "tools/sync_public_classes.py"
      - "tools/test_sync_public_classes.py"
      - "tools/public_class_projection.py"
      - "tools/test_public_class_projection.py"
      - "tools/test_calendar_status_ui.js"
      - "tools/publish_public_classes.sh"
      - "tools/test_calendar_workflow_reliability.py"
      - "assets/ux-lab/class-finder.js"
      - ".github/workflows/class-calendar-sync.yml"
  schedule:
    # Two independent opportunities per hour. GitHub scheduled runs may be delayed or dropped.
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/test_sync_public_classes.py
      - run: python tools/test_public_class_projection.py
      - run: python tools/test_calendar_workflow_reliability.py
      - name: Verify OPEN/CLOSE website status and participation action
        run: node tools/test_calendar_status_ui.js

  publish:
    # Never run calendar access on PRs, forks, or without explicit approval.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      vars.RS_CALENDAR_SYNC_ENABLED == 'true' &&
      vars.RS_OPEN_CLASSES_APPROVED == 'true'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: publish-public-classes
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      RS_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.RS_GOOGLE_SERVICE_ACCOUNT_JSON }}
      RS_LESSON_CALENDAR_ID: ${{ secrets.RS_LESSON_CALENDAR_ID }}
      RS_SESSION_ID_KEY: ${{ secrets.RS_SESSION_ID_KEY }}
      RS_OPEN_CLASSES_APPROVED: ${{ vars.RS_OPEN_CLASSES_APPROVED }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "google-auth==2.38.0" "requests==2.32.3"
      - name: Generate approved public sessions only
        run: python tools/sync_public_classes.py
      - name: Validate public output and existing website contracts
        run: |
          python tools/test_sync_public_classes.py
          python tools/test_public_class_projection.py
          python tools/sites_migration_audit.py
      - name: Publish with bounded non-force conflict handling
        run: bash tools/publish_public_classes.sh
