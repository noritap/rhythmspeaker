name: Schedule Workshop Live Smoke
on:
  pull_request:
    paths:
      - 'tools/schedule_workshop_live_smoke.cjs'
      - '.github/workflows/schedule-workshop-live-smoke.yml'
  push:
    branches: [main]
    paths:
      - 'schedule/**'
      - 'assets/ux-lab/workshop-recommendations.*'
      - 'workshops/sakaida-koji-20261122.html'
      - 'tools/schedule_workshop_live_smoke.cjs'
      - '.github/workflows/schedule-workshop-live-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Verify published HTML, public WS data, rendered cards, real destination and width
        run: node tools/schedule_workshop_live_smoke.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: schedule-workshop-live-evidence
          path: ux-evidence/workshop-live/
