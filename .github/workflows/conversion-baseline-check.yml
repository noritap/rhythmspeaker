name: Conversion Baseline Check

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile conversion report utility
        run: python -m py_compile tools/trial_conversion_report.py
      - name: Validate aggregate baseline schema
        run: python tools/trial_conversion_report.py data/trial_conversion_baseline.csv
