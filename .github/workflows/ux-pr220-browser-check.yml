name: UX PR 220 browser check

on:
  pull_request:
    paths:
      - 'trial/apply/index.html'
      - 'tools/ux_pr220_browser_check.js'
      - '.github/workflows/ux-pr220-browser-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: main
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run local sites and compare viewports
        run: |
          python3 -m http.server 8001 --directory baseline >/tmp/ux-before.log 2>&1 &
          python3 -m http.server 8002 --directory . >/tmp/ux-after.log 2>&1 &
          node tools/ux_pr220_browser_check.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-pr220-evidence
          path: ux-evidence/
