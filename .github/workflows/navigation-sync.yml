name: Navigation Contract Sync Check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate navigation from canonical contract
        run: python tools/navigation_sync.py
      - name: Fail if committed HTML is not synchronized
        run: git diff --exit-code
      - name: Verify strict navigation contract
        run: python tools/navigation_audit.py --strict
