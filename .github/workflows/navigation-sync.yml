name: Navigation Sync

on:
  push:
    branches: ["feature/navigation-sync-strict-20260830"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync navigation from contract
        run: python tools/navigation_sync.py
      - name: Verify strict navigation contract
        run: python tools/navigation_audit.py --strict
      - name: Commit synchronized pages
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No navigation changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html trial/index.html classes/index.html about/index.html ecosystem/index.html faq/index.html access/index.html rss/index.html
          git commit -m "Sync global navigation contract"
          git push
