name: Music GitHub Pages Live Smoke
on:
  push:
    branches: [main]
    paths:
      - "music/**"
      - "tools/music_live_smoke.cjs"
      - ".github/workflows/music-live-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pages-live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify GitHub Pages live content and all four album pages
        run: node tools/music_live_smoke.cjs
