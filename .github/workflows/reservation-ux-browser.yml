name: Reservation UX browser safety
on:
  pull_request:
    paths:
      - 'schedule/**'
      - 'assets/ux-lab/class-finder.*'
      - 'tools/reservation_ux_browser_check.cjs'
      - '.github/workflows/reservation-ux-browser.yml'
  push:
    branches: [main]
    paths:
      - 'schedule/**'
      - 'assets/ux-lab/class-finder.*'
      - 'tools/reservation_ux_browser_check.cjs'
      - '.github/workflows/reservation-ux-browser.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Fixture browser scenarios and six widths (no real submissions)
        run: |
          python3 -m http.server 8020 --directory . >/tmp/reservation-ux-server.log 2>&1 &
          node tools/reservation_ux_browser_check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reservation-ux-evidence
          path: ux-evidence/reservation-v3/
