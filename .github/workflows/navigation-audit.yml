name: Navigation Audit

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile audit utility
        run: python -m py_compile tools/navigation_audit.py
      - name: Report navigation drift baseline
        run: python tools/navigation_audit.py
