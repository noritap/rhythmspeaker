name: Calendar connectivity and privacy preflight (no publishing)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "tools/preflight_calendar_sync.py"
      - "tools/test_preflight_calendar_sync.py"
      - "tools/sync_public_classes.py"
      - "tools/test_sync_public_classes.py"
      - ".github/workflows/class-calendar-preflight.yml"
  pull_request:
    paths:
      - "tools/preflight_calendar_sync.py"
      - "tools/test_preflight_calendar_sync.py"
      - "tools/sync_public_classes.py"
      - "tools/test_sync_public_classes.py"
      - ".github/workflows/class-calendar-preflight.yml"

permissions:
  contents: read

jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify whitelist/parser compatibility
        run: python tools/test_sync_public_classes.py
      - name: Verify sanitized preflight output
        run: python tools/test_preflight_calendar_sync.py
      - name: Verify existing public class projection
        run: python tools/test_public_class_projection.py

  read-only-live-preflight:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: offline-contracts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RS_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.RS_GOOGLE_SERVICE_ACCOUNT_JSON }}
      RS_LESSON_CALENDAR_ID: ${{ secrets.RS_LESSON_CALENDAR_ID }}
      RS_SESSION_ID_KEY: ${{ secrets.RS_SESSION_ID_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install read-only Google auth
        run: python -m pip install "google-auth==2.38.0" "requests==2.32.3"
      - name: Authenticate, inspect eligible schema, verify no private fields leak
        run: python tools/preflight_calendar_sync.py
      - name: Verify public schedule data was not modified
        run: git diff --exit-code -- data/class-sessions.public.json
