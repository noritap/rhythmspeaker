name: Optimize class photos (3VC)
on:
  push:
    branches:
      - perf/image-delivery-class-3vc
    paths:
      - scripts/optimize_class_images.py
      - .github/workflows/optimize-class-photos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install 'Pillow>=11,<13'
      - name: Generate, replace and validate image references
        run: python scripts/optimize_class_images.py
      - name: Ensure no oversized optimized image
        run: |
          python - <<'PY'
          from pathlib import Path
          files=list(Path('assets/classes').glob('*-[0-9]*w.webp'))
          assert len(files)>=12, f'Expected 12 responsive images, got {len(files)}'
          assert all(p.stat().st_size<350*1024 for p in files), 'Oversized image'
          print(f'PASS: {len(files)} responsive WebP assets')
          PY
      - name: Commit generated assets and references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/classes index.html classes/index.html style.css
          if ! git diff --cached --quiet; then
            git commit -m "perf: deliver responsive WebP class photos"
            git push
          fi
