name: Trial image optimization (temporary)
on:
  push:
    branches: [feat/trial-body-and-tap-webp-v1]
    paths:
      - '.github/workflows/trial-image-optimization.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - name: Convert TAP and BODY images and update HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageOps
          import re
          out = Path('assets/images/trial')
          out.mkdir(parents=True, exist_ok=True)
          tap_src = out / 'trial-your-start-step-to-tap-dance-v2.png'
          tap_out = out / 'trial-your-start-step-to-tap-dance-v2.webp'
          with Image.open(tap_src) as im:
              im = ImageOps.exif_transpose(im).convert('RGB')
              im.save(tap_out, 'WEBP', quality=82, method=6)
              print('TAP', tap_out.stat().st_size, im.size)
          body_src = Path('assets/classes/class-stretch-editorial-v1.png')
          body_out = out / 'trial-your-start-body-classes-v1.webp'
          with Image.open(body_src) as im:
              im = ImageOps.exif_transpose(im).convert('RGB')
              im.thumbnail((1200, 800), Image.Resampling.LANCZOS)
              im.save(body_out, 'WEBP', quality=82, method=6)
              print('BODY', body_out.stat().st_size, im.size)
          page = Path('trial/index.html')
          html = page.read_text(encoding='utf-8')
          tap_old = 'trial-your-start-step-to-tap-dance-v2.png'
          assert html.count(tap_old) == 1
          html = html.replace(tap_old, tap_out.name, 1)
          pat = r'(<article class="recommend-row" id="recommend-body">\s*)<img[^>]+>'
          new = (r'\1<img src="../assets/images/trial/' + body_out.name +
                 '" alt="身体を伸ばしながら柔軟性と身体操作を高めるストレッチクラス" width="' +
                 str(im.width) + '" height="' + str(im.height) + '" loading="lazy" decoding="async">')
          html, count = re.subn(pat, new, html)
          assert count == 1, f'BODY target count {count}'
          page.write_text(html, encoding='utf-8')
          PY
      - name: Commit optimized images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/trial/trial-your-start-step-to-tap-dance-v2.webp assets/images/trial/trial-your-start-body-classes-v1.webp trial/index.html
          git diff --cached --check
          git commit -m "feat: optimize TAP image and restore BODY CLASSES image"
          git push
