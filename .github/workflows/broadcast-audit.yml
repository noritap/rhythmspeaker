name: Broadcast Audit

on:
  pull_request:
    paths:
      - "broadcast/**"
      - "ecosystem/index.html"
      - "tools/broadcast_audit.py"
      - ".github/workflows/broadcast-audit.yml"
  push:
    branches: ["main"]
    paths:
      - "broadcast/**"
      - "ecosystem/index.html"
      - "tools/broadcast_audit.py"
      - ".github/workflows/broadcast-audit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Compile broadcast audit utility
        run: python -m py_compile tools/broadcast_audit.py
      - name: Check broadcast JavaScript syntax
        run: node --check broadcast/app.js
      - name: Enforce broadcast data and route contract
        run: python tools/broadcast_audit.py --strict
