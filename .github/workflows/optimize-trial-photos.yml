name: Optimize trial photos and audit images (3VC)
on:
  push:
    branches: [perf/trial-photo-budget-3vc]
    paths:
      - scripts/optimize_trial_and_audit_images.py
      - .github/workflows/optimize-trial-photos.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - name: Optimize and audit trial page
        run: python scripts/optimize_trial_and_audit_images.py
      - name: Commit optimized photos and references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/trial trial/index.html
          if ! git diff --cached --quiet; then
            git commit -m "perf: publish optimized trial photos"
            git push
          fi
